<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SecureDocs - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
    <div class="container" style="max-width: 500px;">
        <div class="card shadow mt-4">
            <div class="card-header bg-primary text-white text-center">
                <h3>🔐 SecureDocs</h3>
                <p class="m-0">Módulo de Autenticación (JWT)</p>
            </div>
            <div class="card-body">
                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label">Correo electrónico</label>
                        <input type="email" id="correo" class="form-control" value="carlos.ruiz@techcorp.com" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" id="password" class="form-control" value="123456" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Iniciar Sesión</button>
                </form>

                <div id="resultado" class="mt-4 d-none">
                    <div class="alert alert-success">
                        <h5>¡Autenticación Exitosa!</h5>
                        <p class="mb-1"><strong>Usuario:</strong> <span id="uNombre"></span></p>
                        <p class="mb-1"><strong>Rol:</strong> <span id="uRol"></span></p>
                        <p class="mb-1"><strong>Departamento:</strong> <span id="uDept"></span></p>
                        <hr>
                        <small class="text-break"><strong>JWT Token:</strong> <span id="uToken"></span></small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const correo = document.getElementById('correo').value;
            const password = document.getElementById('password').value;

            const res = await fetch('/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ correo, password })
            });

            const data = await res.json();
            if (res.ok) {
                document.getElementById('resultado').classList.remove('d-none');
                document.getElementById('uNombre').innerText = data.usuario.nombre;
                document.getElementById('uRol').innerText = data.usuario.rol;
                document.getElementById('uDept').innerText = data.usuario.departamento;
                document.getElementById('uToken').innerText = data.token;
            } else {
                alert(data.mensaje);
            }
        });
    </script>
</body>
</html>
